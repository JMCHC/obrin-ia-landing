<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner 2D - Obrín IA</title>
    <!-- Importamos Tailwind CSS directamente -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Clase auxiliar para ocultar pantallas suavemente */
        .oculto { display: none !important; }
    </style>
</head>
<body class="bg-gray-900 text-white overflow-hidden font-sans w-full h-screen relative selection:bg-blue-500">

    <!-- Canvas invisible para procesar la foto -->
    <canvas id="canvas" class="hidden"></canvas>

    <!-- Feed de la cámara (Fondo) -->
    <video id="video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover z-0 oculto"></video>
    <div id="video-overlay" class="absolute inset-0 bg-black/30 z-10 pointer-events-none oculto"></div>

    <!-- PANTALLA 0: Permisos -->
    <div id="pantalla-0" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-6 text-center bg-gray-900">
        <div class="w-16 h-16 mb-6 bg-blue-600 rounded-lg flex items-center justify-center text-3xl shadow-lg shadow-blue-500/50">📷</div>
        <h1 class="text-2xl font-bold mb-2">Escáner de Muros 2D</h1>
        <p class="text-gray-400 mb-8 max-w-sm">Para iniciar el levantamiento, Obrín IA necesita acceso a tu cámara y al giroscopio de tu dispositivo.</p>
        <p id="error-msg" class="text-red-400 mb-4 bg-red-900/30 p-3 rounded font-medium oculto"></p>
        <button id="btn-iniciar" class="bg-blue-600 hover:bg-blue-500 w-full max-w-xs py-4 rounded-xl font-bold text-lg transition-all shadow-lg active:scale-95">
            Habilitar Sensores
        </button>
    </div>

    <!-- PANTALLA 1: Tomar primera foto -->
    <div id="pantalla-1" class="absolute inset-0 z-20 flex-col items-center justify-between pb-12 pt-20 flex oculto">
        <div class="bg-black/60 px-6 py-3 rounded-full backdrop-blur-md border border-gray-600 shadow-xl">
            <p class="text-lg font-medium tracking-wide">Sitúate al inicio del muro</p>
        </div>
        <button id="btn-foto1" class="w-20 h-20 bg-white/20 rounded-full border-4 border-white flex items-center justify-center backdrop-blur-sm active:scale-90 transition-transform shadow-2xl">
            <div class="w-16 h-16 bg-white rounded-full"></div>
        </button>
    </div>

    <!-- PANTALLA 2: Guiado con Giroscopio -->
    <div id="pantalla-2" class="absolute inset-0 z-20 flex-col items-center justify-center pb-12 flex oculto">
        <div class="bg-black/70 p-6 rounded-2xl backdrop-blur-md border border-gray-600 w-11/12 max-w-sm flex flex-col items-center shadow-2xl">
            <p id="texto-guia" class="text-xl font-bold mb-6 text-white transition-colors duration-300">Gira a la derecha suavemente</p>
            
            <!-- Interfaz tipo Nivel/Brújula -->
            <div class="w-full bg-gray-800 h-10 rounded-full relative overflow-hidden border border-gray-500 mb-2 shadow-inner">
                <div class="absolute top-0 bottom-0 left-1/2 w-10 -ml-5 bg-green-500/30 border-x-2 border-green-500"></div>
                <div id="punto-guia" class="absolute top-1/2 -mt-3 w-6 h-6 rounded-full shadow-[0_0_15px_rgba(255,255,255,0.8)] transition-all duration-100 ease-out z-10 bg-white" style="left: 50%; transform: translateX(-50%);"></div>
            </div>
        </div>
    </div>

    <!-- PANTALLA 3: Resultado de Captura -->
    <div id="pantalla-3" class="absolute inset-0 z-50 bg-gray-900 overflow-y-auto p-6 flex-col items-center flex oculto">
        <h2 class="text-2xl font-bold mb-2 mt-4 text-green-400">Captura Lista</h2>
        <p class="text-gray-400 mb-8 text-center text-sm">Imágenes pre-procesadas. Listas para IA y Costura 2D.</p>
        
        <div class="flex flex-col gap-5 w-full max-w-md">
            <div class="relative group">
                <span class="absolute top-3 left-3 bg-black/80 px-3 py-1 text-xs rounded-md font-bold backdrop-blur-sm border border-gray-700">Foto 1 (Izquierda)</span>
                <img id="img-foto1" class="w-full rounded-xl border-2 border-gray-700 shadow-lg object-cover aspect-video" />
            </div>
            <div class="relative group">
                <span class="absolute top-3 left-3 bg-black/80 px-3 py-1 text-xs rounded-md font-bold backdrop-blur-sm border border-gray-700">Foto 2 (Derecha)</span>
                <img id="img-foto2" class="w-full rounded-xl border-2 border-gray-700 shadow-lg object-cover aspect-video" />
            </div>
        </div>

        <div class="mt-8 flex gap-4 w-full max-w-md pb-8">
            <button id="btn-repetir" class="flex-1 bg-gray-800 hover:bg-gray-700 py-4 rounded-xl font-semibold border border-gray-700 transition-colors">Repetir</button>
            <button class="flex-1 bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold shadow-lg shadow-blue-500/30 transition-colors">Fase 2 (Pronto)</button>
        </div>
    </div>

    <script>
        // Referencias al DOM
        const ui = {
            video: document.getElementById('video'),
            canvas: document.getElementById('canvas'),
            overlay: document.getElementById('video-overlay'),
            pantallas: [
                document.getElementById('pantalla-0'),
                document.getElementById('pantalla-1'),
                document.getElementById('pantalla-2'),
                document.getElementById('pantalla-3')
            ],
            btnIniciar: document.getElementById('btn-iniciar'),
            btnFoto1: document.getElementById('btn-foto1'),
            btnRepetir: document.getElementById('btn-repetir'),
            errorMsg: document.getElementById('error-msg'),
            textoGuia: document.getElementById('texto-guia'),
            puntoGuia: document.getElementById('punto-guia'),
            imgFoto1: document.getElementById('img-foto1'),
            imgFoto2: document.getElementById('img-foto2'),
        };

        // Estado de la aplicación
        let pasoActual = 0;
        let anguloInicial = null;
        let anguloActual = 0;
        let fotos = [];
        let timerEstabilidad = null;
        
        const GRADOS_OBJETIVO = 25;
        const MARGEN_TOLERANCIA = 2; // +/- 2 grados

        // Navegación entre pantallas
        function cambiarPantalla(paso) {
            ui.pantallas.forEach(p => p.classList.add('oculto'));
            ui.pantallas[paso].classList.remove('oculto');
            
            // Mostrar/Ocultar cámara de fondo
            if (paso === 1 || paso === 2) {
                ui.video.classList.remove('oculto');
                ui.overlay.classList.remove('oculto');
            } else {
                ui.video.classList.add('oculto');
                ui.overlay.classList.add('oculto');
            }
            pasoActual = paso;
        }

        // Extraer fotograma del video
        function tomarFotoBase64() {
            ui.canvas.width = ui.video.videoWidth;
            ui.canvas.height = ui.video.videoHeight;
            ui.canvas.getContext('2d').drawImage(ui.video, 0, 0);
            return ui.canvas.toDataURL('image/jpeg', 0.85); // 0.85 para optimizar peso
        }

        // 1. Iniciar Sensores
        ui.btnIniciar.addEventListener('click', async () => {
            try {
                // Pedir Cámara
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                ui.video.srcObject = stream;

                // Pedir Giroscopio (Obligatorio en iOS 13+)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permiso = await DeviceOrientationEvent.requestPermission();
                    if (permiso !== 'granted') throw new Error('Se requiere acceso al movimiento del celular.');
                }

                // Iniciar escucha del giroscopio
                window.addEventListener('deviceorientation', manejarGiroscopio);
                cambiarPantalla(1);
            } catch (err) {
                ui.errorMsg.textContent = err.message || 'Error: Revisa los permisos de cámara y movimiento de tu navegador.';
                ui.errorMsg.classList.remove('oculto');
            }
        });

        // 2. Foto Inicial
        ui.btnFoto1.addEventListener('click', () => {
            fotos[0] = tomarFotoBase64();
            ui.imgFoto1.src = fotos[0];
            anguloInicial = anguloActual; // Fijamos el punto cero
            cambiarPantalla(2);
        });

        // 3. Lógica del Giroscopio
        function manejarGiroscopio(e) {
            if (pasoActual !== 2 || e.alpha === null) return;
            anguloActual = e.alpha;

            // Calcular diferencia asumiendo que 0 = 360
            let diferencia = anguloInicial - anguloActual;
            if (diferencia < -180) diferencia += 360;
            if (diferencia > 180) diferencia -= 360;

            let progreso = diferencia;
            
            // Mover el punto visual (Multiplicador * 5 para que sea sensible)
            let pxMovimiento = (progreso - GRADOS_OBJETIVO) * 5;
            ui.puntoGuia.style.left = `calc(50% + ${pxMovimiento}px)`;

            let estaEnPosicion = Math.abs(progreso - GRADOS_OBJETIVO) <= MARGEN_TOLERANCIA;

            // Lógica visual y disparo automático
            if (estaEnPosicion) {
                ui.textoGuia.textContent = "¡Mantén firme el celular!";
                ui.textoGuia.className = "text-xl font-bold mb-6 text-green-400 transition-colors duration-300";
                ui.puntoGuia.className = "absolute top-1/2 -mt-3 w-6 h-6 rounded-full shadow-[0_0_20px_rgba(74,222,128,1)] transition-all duration-100 ease-out z-10 bg-green-400 scale-125";

                if (!timerEstabilidad) {
                    timerEstabilidad = setTimeout(() => {
                        fotos[1] = tomarFotoBase64();
                        ui.imgFoto2.src = fotos[1];
                        cambiarPantalla(3);
                        timerEstabilidad = null; // Limpiar
                    }, 1200); // 1.2 segundos estable
                }
            } else {
                ui.textoGuia.textContent = "Gira a la derecha suavemente";
                ui.textoGuia.className = "text-xl font-bold mb-6 text-white transition-colors duration-300";
                ui.puntoGuia.className = "absolute top-1/2 -mt-3 w-6 h-6 rounded-full shadow-[0_0_15px_rgba(255,255,255,0.8)] transition-all duration-100 ease-out z-10 bg-white";

                if (timerEstabilidad) {
                    clearTimeout(timerEstabilidad);
                    timerEstabilidad = null;
                }
            }
        }

        // Botón Repetir
        ui.btnRepetir.addEventListener('click', () => {
            fotos = [];
            anguloInicial = null;
            cambiarPantalla(1);
        });
    </script>
</body>
</html>
