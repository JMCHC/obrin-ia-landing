<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nube de Puntos 3D - Obrín IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #info-ui { position: absolute; top: 20px; left: 20px; right: 20px; z-index: 50; pointer-events: none; }
    </style>
    <!-- Importación de Three.js (Motor Gráfico 3D) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="info-ui" class="bg-black/60 backdrop-blur-md p-4 rounded-2xl border border-white/20 text-white shadow-xl">
        <div class="flex justify-between items-center mb-2">
            <h1 class="font-bold text-lg">Motor Espacial 3D</h1>
            <span class="bg-orange-500 text-xs px-2 py-1 rounded-full font-bold">WebXR</span>
        </div>
        <p class="text-sm text-gray-300 mb-2">Mueve el teléfono lentamente para escanear las superficies.</p>
        <div class="flex justify-between text-xs font-mono text-orange-400">
            <span id="point-count">Puntos: 0</span>
            <span id="status">Buscando entorno...</span>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera, scene, renderer;
        let controller, reticle;
        
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        // Estructura de datos para la nube de puntos
        const MAX_POINTS = 50000;
        let pointCount = 0;
        let positions = new Float32Array(MAX_POINTS * 3);
        let pointCloudGeometry, pointCloud;

        const uiStatus = document.getElementById('status');
        const uiCount = document.getElementById('point-count');

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // Luz para visualizar mejor los puntos
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // Activar Realidad Aumentada
            container.appendChild(renderer.domElement);

            // Configurar el botón de AR con solicitud de Hit Testing (cálculo de profundidad)
            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

            // Configurar la Nube de Puntos (Particle System)
            pointCloudGeometry = new THREE.BufferGeometry();
            pointCloudGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            // Material de los puntos (Color naranja Obrín IA)
            const material = new THREE.PointsMaterial({ 
                color: 0xf97316, 
                size: 0.015, // Tamaño milimétrico de cada punto
                sizeAttenuation: true 
            });
            
            pointCloud = new THREE.Points(pointCloudGeometry, material);
            scene.add(pointCloud);

            // Retícula visual (El anillo que muestra dónde está detectando la superficie)
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Evento al tocar la pantalla: Guardar el punto 3D
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            window.addEventListener('resize', onWindowResize);
        }

        function onSelect() {
            if (reticle.visible && pointCount < MAX_POINTS) {
                // Extraer las coordenadas X, Y, Z del mundo real
                const position = new THREE.Vector3();
                position.setFromMatrixPosition(reticle.matrix);

                // Guardar en la matriz de la nube de puntos
                positions[pointCount * 3] = position.x;
                positions[pointCount * 3 + 1] = position.y;
                positions[pointCount * 3 + 2] = position.z;

                pointCount++;
                uiCount.innerText = `Puntos: ${pointCount}`;
                
                // Actualizar la tarjeta gráfica
                pointCloudGeometry.attributes.position.needsUpdate = true;
                pointCloudGeometry.setDrawRange(0, pointCount);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then(function (referenceSpace) {
                        session.requestHitTestSource({ space: referenceSpace }).then(function (source) {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', function () {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);

                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        // Mover la retícula al punto físico detectado
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                        uiStatus.innerText = "Superficie detectada";
                        uiStatus.classList.replace('text-orange-400', 'text-green-400');
                        
                        // AUTO-ESCANEO: Agregar puntos automáticamente mientras te mueves
                        // Si quieres que solo grabe al hacer clic, comenta este bloque IF
                        if (pointCount < MAX_POINTS && Math.random() > 0.5) {
                            const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
                            // Agregar un poco de ruido para dispersar la nube
                            positions[pointCount * 3] = pos.x + (Math.random() - 0.5) * 0.05;
                            positions[pointCount * 3 + 1] = pos.y + (Math.random() - 0.5) * 0.05;
                            positions[pointCount * 3 + 2] = pos.z + (Math.random() - 0.5) * 0.05;
                            pointCount++;
                            pointCloudGeometry.attributes.position.needsUpdate = true;
                            pointCloudGeometry.setDrawRange(0, pointCount);
                            uiCount.innerText = `Puntos: ${pointCount}`;
                        }
                    } else {
                        reticle.visible = false;
                        uiStatus.innerText = "Buscando entorno...";
                        uiStatus.classList.replace('text-green-400', 'text-orange-400');
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
