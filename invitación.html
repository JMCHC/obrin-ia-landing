<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una invitación especial para ti</title>
    
    <!-- Cargando Tailwind CSS para los estilos rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes de Google: Una cursiva romántica y una moderna para lectura -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            overflow: hidden; /* Evita barras de desplazamiento por los corazones */
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1, h2, .romantic-text {
            font-family: 'Dancing Script', cursive;
        }

        /* Estilos para los corazones flotantes del fondo */
        .heart {
            position: absolute;
            bottom: -10vh;
            transform: scale(0.5);
            animation: floatUp 10s linear infinite;
            z-index: 0;
            opacity: 0.6;
            color: rgba(255, 255, 255, 0.8);
            font-size: 2rem;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Contenedores de las pantallas */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
            z-index: 10;
        }

        .hidden-screen {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }

        /* El botón "No" necesita posicionamiento absoluto cuando empiece a moverse */
        #btn-no {
            transition: top 0.2s ease, left 0.2s ease;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            width: 400px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Contenedor para los corazones animados -->
    <div id="hearts-container"></div>

    <!-- Audio de fondo: Ed Sheeran - Perfect -->
    <audio id="bg-music" loop>
        <source src="perfect.mp3" type="audio/mpeg">
    </audio>

    <!-- PANTALLA 1: Inicio (necesaria para activar el audio) -->
    <div id="screen-intro" class="screen">
        <div class="card transform hover:scale-105 transition duration-300 cursor-pointer" id="btn-open">
            <div class="text-6xl mb-4">💌</div>
            <h2 class="text-3xl text-pink-600 mb-2 font-bold">Martina, tienes un mensaje</h2>
            <p class="text-gray-600">Toca para abrir</p>
        </div>
    </div>

    <!-- PANTALLA 2: La Invitación -->
    <div id="screen-invite" class="screen hidden-screen">
        <div class="card relative">
            <h1 class="text-5xl text-pink-600 mb-6 leading-tight">Hola hermosa...</h1>
            <p class="text-xl text-gray-700 mb-8 font-semibold">
                ¿Te gustaría ir conmigo mañana a las 21:20 a ver "Madre Siniestra"? 🎬🍿<br><br>
                Yo paso por ti y de ahí nos vamos al cine. 🚗💨
            </p>
            
            <!-- Contenedor de botones -->
            <div class="flex justify-center gap-4 relative h-16 w-full" id="buttons-container">
                <button id="btn-yes" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-110 transition duration-200 z-20">
                    ¡Sí, me encantaría!
                </button>
                <button id="btn-no" class="bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold py-3 px-8 rounded-full shadow z-20">
                    No
                </button>
            </div>
        </div>
    </div>

    <!-- PANTALLA 3: Éxito (Después de decir Sí) -->
    <div id="screen-success" class="screen hidden-screen">
        <div class="card">
            <div class="text-6xl mb-4 animate-bounce">💖</div>
            <h1 class="text-5xl text-pink-600 mb-4">¡Sabía que dirías que sí!</h1>
            <p class="text-lg text-gray-700">
                Prepárate, va a ser una cita increíble.<br>
                Te escribo para coordinar los detalles. 🥰
            </p>
        </div>
    </div>

    <script>
        // Variables de elementos
        const screenIntro = document.getElementById('screen-intro');
        const screenInvite = document.getElementById('screen-invite');
        const screenSuccess = document.getElementById('screen-success');
        
        const btnOpen = document.getElementById('btn-open');
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        const bgMusic = document.getElementById('bg-music');
        const heartsContainer = document.getElementById('hearts-container');

        // Función para generar corazones flotantes de fondo
        function createHearts() {
            const symbols = ['❤️', '💖', '✨', '💕'];
            for (let i = 0; i < 20; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 10 + 5) + 's';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heartsContainer.appendChild(heart);
            }
        }
        createHearts();

        // 1. Abrir la carta y reproducir música
        btnOpen.addEventListener('click', () => {
            // Reproducir música (bajando un poco el volumen)
            bgMusic.volume = 0.5;
            bgMusic.play().catch(e => console.log("El navegador bloqueó el autoplay", e));
            
            // Transición de pantallas
            screenIntro.classList.add('hidden-screen');
            setTimeout(() => {
                screenInvite.classList.remove('hidden-screen');
            }, 500);
        });

        // 2. El botón "No" se escapa (Para PC y Móvil)
        function moveButton() {
            // Cambiamos a position absolute respecto al body para que pueda moverse por toda la pantalla
            btnNo.style.position = 'fixed';
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;
            
            // Calculamos posiciones aleatorias asegurando que no se salga de la pantalla
            const randomX = Math.floor(Math.random() * (windowWidth - btnWidth));
            const randomY = Math.floor(Math.random() * (windowHeight - btnHeight));
            
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // Eventos para que se escape en PC (mouse) y celulares (toque)
        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Evita el clic accidental en móviles
            moveButton();
        });

        // 3. Clic en "Sí"
        btnYes.addEventListener('click', () => {
            screenInvite.classList.add('hidden-screen');
            setTimeout(() => {
                screenSuccess.classList.remove('hidden-screen');
                // Añadir más corazones de celebración
                createHearts();
                createHearts();
                
                // Redirigir a WhatsApp después de 3 segundos para que alcance a leer
                setTimeout(() => {
                    const numero = "56992582669";
                    const mensaje = "¡Siii, me encantaría ir al cine mañana contigo! 🍿🎬";
                    window.location.href = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
                }, 3000);
                
            }, 500);
        });
    </script>
</body>
</html>
