<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una Invitación Especial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            overflow-x: hidden;
        }

        /* Estilos de la portada (sobre) */
        #cover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .cover-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 40, 100, 0.1);
            max-width: 350px;
            text-align: center;
        }
        .cover-card span {
            font-size: 60px;
            display: block;
            margin-bottom: 20px;
        }
        .cover-card h2 {
            color: #0369a1;
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .btn-abrir {
            background-color: #0284c7;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            transition: transform 0.2s, background-color 0.3s;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }
        .btn-abrir:hover {
            background-color: #0369a1;
            transform: scale(1.05);
        }

        /* Estilos de la tarjeta principal */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 40, 100, 0.1);
            max-width: 420px;
            position: relative;
            z-index: 10;
        }
        img {
            width: 220px;
            height: auto;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: opacity 0.4s ease;
        }
        h1 {
            color: #0369a1;
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            color: #475569;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            transition: transform 0.2s, background-color 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #btn-yes {
            background-color: #0284c7;
            color: white;
        }
        #btn-yes:hover {
            background-color: #0369a1;
            transform: scale(1.05);
        }
        #btn-no {
            background-color: #f1f5f9;
            color: #64748b;
            position: relative;
        }
        
        #location-options {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .location-btn {
            background-color: #f8fafc;
            color: #0369a1;
            border: 2px solid #bae6fd;
            padding: 12px 20px;
            border-radius: 15px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .location-btn:hover {
            background-color: #e0f2fe;
            border-color: #7dd3fc;
            transform: translateY(-2px);
        }

        #wa-container {
            display: none;
            margin-top: 10px;
        }
        #btn-wa {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            transition: transform 0.2s, background-color 0.3s;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }
        #btn-wa:hover {
            background-color: #128C7E;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Audio oculto (usando el nombre exacto de tu repositorio) -->
    <audio id="musica-fondo" src="Stitch.mp3.mp3" preload="auto"></audio>

    <!-- Pantalla de portada para habilitar el sonido -->
    <div id="cover">
        <div class="cover-card">
            <span>💌</span>
            <h2>Tienes una invitación por aceptar...</h2>
            <button class="btn-abrir" onclick="abrirCarta()">Abrir carta</button>
        </div>
    </div>

    <!-- Contenido principal de la invitación -->
    <div class="card" id="card">
        <img id="stitch-img" src="https://lh3.googleusercontent.com/pw/AP1GczNIp1Ani-brp_2W6kXfFAXUvHLd31Q97El4BsifdbOiCMZhcVg7ihWArZg-PhLwbz0FltxPapiR4P203ZcZCx3sQW2ukdxnkmE1-zTebBvmD9lPb5doCXrIIKvkNl5ewrzaBu99xofUoNjDWEyKjYvFYQ=w451-h599-s-no-gm?authuser=0" alt="Stitch con Helado">
        
        <h1 id="title">¡Una dulce invitación!</h1>
        <p id="message">
            Hola Valentina,<br><br>
            Me encantaría que nos conociéramos y qué mejor forma de hacerlo que compartiendo un buen helado hoy en el Cassis.<br><br>
            ¿Te animas a acompañarme esta tarde?
        </p>
        
        <div class="buttons">
            <button id="btn-yes" onclick="aceptar()">Sí, acepto</button>
            <button id="btn-no" onmouseover="escapar(this)" ontouchstart="escapar(this)">No</button>
        </div>

        <div id="location-options">
            <button class="location-btn" onclick="seleccionarLugar('Parque Arauco')">📍 Cassis Parque Arauco</button>
            <button class="location-btn" onclick="seleccionarLugar('Mallplaza Los Dominicos')">📍 Cassis Los Dominicos</button>
        </div>

        <div id="wa-container">
            <a id="btn-wa" href="#" target="_blank">Confirmo que asistiré</a>
        </div>
    </div>

    <script>
        // Función para abrir la carta y reproducir la música desde el segundo 16
        function abrirCarta() {
            const cover = document.getElementById('cover');
            const musica = document.getElementById('musica-fondo');
            
            // Iniciar música en el segundo 16
            musica.currentTime = 16;
            musica.volume = 0.6;
            musica.play();
            
            // Ocultar portada con efecto de desvanecimiento
            cover.style.opacity = '0';
            cover.style.visibility = 'hidden';
        }

        function escapar(btn) {
            btn.style.position = 'fixed';
            
            const anchoVentana = window.innerWidth - btn.offsetWidth - 20;
            const altoVentana = window.innerHeight - btn.offsetHeight - 20;
            
            const nuevoX = Math.max(10, Math.floor(Math.random() * anchoVentana));
            const nuevoY = Math.max(10, Math.floor(Math.random() * altoVentana));
            
            btn.style.left = nuevoX + 'px';
            btn.style.top = nuevoY + 'px';
        }

        function aceptar() {
            document.getElementById('title').innerText = "¡Excelente elección!";
            document.getElementById('title').style.color = "#047857";
            
            document.getElementById('message').innerHTML = "¿A cuál de los dos prefieres que vayamos hoy?";
            
            document.getElementById('stitch-img').src = "https://lh3.googleusercontent.com/pw/AP1GczOZuIdMZFAywb8FyOe0dk9zzvR84hoe5B-c7zNq6kfWH_tGo2_LIX92Fk7Ske0uPtiwrfqs2wUu0kDPJw3UDKooyqIFTU0EuMKBlsSjfv8LvVJyS5f7uAExrrsceNLTeiflQln_lmaDp2fB0QhDQ6Bk7Q=w433-h599-s-no-gm?authuser=0";
            
            document.querySelector('.buttons').style.display = 'none';
            document.getElementById('location-options').style.display = 'flex';
        }

        function seleccionarLugar(lugar) {
            document.getElementById('location-options').style.display = 'none';
            
            document.getElementById('message').innerHTML = `¡Genial! Nos vemos hoy en el Cassis <b>${lugar}</b>.<br><br>No voy a preguntarte las típicas cosas aburridas...👀`;
            
            const telefono = "56992582669";
            const textoWs = `¡Holaa! Confirmo que iremos a tomar helado en el Cassis ${lugar} hoy 🍦🩷💙`;
            document.getElementById('btn-wa').href = `https://api.whatsapp.com/send?phone=${telefono}&text=${encodeURIComponent(textoWs)}`;
            
            document.getElementById('wa-container').style.display = 'block';
        }
    </script>
</body>
</html>
