<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credencial - Obrín IA</title>
<!-- Librería html2pdf -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f2f2f7; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  
  .wallet-pass {
    width: 320px;
    background-color: #000000; 
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    overflow: hidden;
    color: #ffffff; 
    position: relative;
    border: 2px solid #ff6b00; 
  }

  .pass-header {
    padding: 15px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .pass-header img {
    width: 60px;
    height: 60px;
    border-radius: 50%; 
    object-fit: contain;
  }

  .pass-body {
    padding: 0 20px 15px;
  }

  .user-info {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
  }

  .user-info img {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 2px solid #ff6b00; 
    margin-right: 15px;
    object-fit: cover;
    background-color: #333;
  }

  .user-details h2 {
    margin: 0 0 2px 0;
    font-size: 19px;
  }

  .user-details p {
    margin: 0;
    font-size: 14px;
    color: #ff6b00; 
    font-weight: 600;
  }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
  }

  .field label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 2px;
    color: #a3a3a3; 
  }

  .field span {
    font-size: 13px;
    font-weight: 600;
    color: #ffffff; 
  }

  /* Campo ancho para la universidad */
  .field.full-width {
    grid-column: span 2;
  }

  .qr-section {
    background-color: #ffffff;
    padding: 15px;
    text-align: center;
    border-radius: 12px;
    margin: 0 15px 15px;
    color: #000000;
  }

  .qr-section img {
    width: 140px;
    height: 140px;
  }

  .qr-section p {
    margin: 10px 0 0;
    font-size: 12px;
    font-weight: 600;
    color: #ff6b00; 
  }

  .demo-buttons {
    margin-bottom: 20px;
  }
  
  .demo-buttons button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background-color: #ff6b00; 
    color: white;
    cursor: pointer;
    font-weight: bold;
    margin: 0 5px;
  }

  /* Contenedor de botones de acción debajo de la tarjeta */
  .action-buttons {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .download-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background-color: #333; 
    color: white;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background-color 0.2s;
  }

  .download-btn:hover {
    background-color: #555;
  }
  
  /* Estilo del botón de Apple Wallet */
  .wallet-btn {
    display: inline-block;
    cursor: pointer;
    transition: transform 0.2s;
  }
  
  .wallet-btn:hover {
    transform: scale(1.05);
  }
  
  .wallet-btn img {
    height: 40px; /* Tamaño estándar del botón de Apple */
  }

</style>
</head>
<body>

<div class="demo-buttons" data-html2canvas-ignore="true">
  <button onclick="setUser('jose')">Ver Credencial de José Manuel</button>
  <button onclick="setUser('clemente')">Ver Credencial de Clemente</button>
</div>

<!-- CREDENCIAL (Lo que se captura en el PDF) -->
<div class="wallet-pass" id="credencial-pass">
  <div class="pass-header">
    <img src="https://lh3.googleusercontent.com/pw/AP1GczPJ1o1fhAFasqk2uwiGOuIwNnr0sd1sbMIaseQEzlyn_W_xjs_k8gFJqlCiuerfw-PzV3uiZAbh26Ueap4seYL8PGOG-kX_Nt3Ptlf2HiAuTbkJB0C-gjHkn91LqRKKtxXLb-pKqaf1YG9RZ6xaPU9qyQ=w599-h599-s-no-gm?authuser=0" alt="Logo Obrín IA">
  </div>
  
  <div class="pass-body">
    <div class="user-info">
      <img id="user-photo" src="" alt="Foto de perfil">
      <div class="user-details">
        <h2 id="user-name">Nombre</h2>
        <p id="user-role">Cargo</p>
      </div>
    </div>
    
    <div class="fields">
      <div class="field">
        <label>Teléfono</label>
        <span id="user-phone"></span>
      </div>
      <div class="field">
        <label>Email</label>
        <span id="user-email" style="font-size: 11px;"></span>
      </div>
      <div class="field">
        <label>Carrera</label>
        <span id="user-career"></span>
      </div>
      <div class="field full-width">
        <label>Universidad</label>
        <span id="user-university"></span>
      </div>
    </div>
  </div>

  <div class="qr-section">
    <img id="user-qr" src="" alt="Código QR">
    <p>Escanear para compartir contacto</p>
  </div>
</div>

<!-- Botones de Acción (No aparecen en el PDF) -->
<div class="action-buttons" data-html2canvas-ignore="true">
  
  <!-- BOTÓN AGREGAR A APPLE WALLET -->
  <a id="btn-apple-wallet" href="#" class="wallet-btn" title="Agregar a Apple Wallet">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Add_to_Apple_Wallet_logo.svg/320px-Add_to_Apple_Wallet_logo.svg.png" alt="Agregar a Apple Wallet">
  </a>

  <!-- BOTÓN DESCARGAR PDF -->
  <button class="download-btn" onclick="descargarPDF()">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
      <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
      <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
    </svg>
    Descargar PDF
  </button>
</div>

<script>
  const users = {
    jose: {
      name: "José Manuel Christensen",
      role: "Co-Fundador / CEO",
      phone: "+56 9 9258 2669", 
      email: "jose@obrinia.cl",
      career: "Construcción Civil",
      university: "P. Universidad Católica de Chile",
      photo: "https://lh3.googleusercontent.com/pw/AP1GczPx1EJ_8fIwPO2dphbWGkNuor7vTGc9aKzSdIdvFeLuH3WCy24NLlHLs1BCK9M5qrCeB8DxVYks-46LohhaR4NA4K3pyxX7sqHCackmj7pPEiKmArQaN-v5HpnKrY5Z5MLLLSdUR3Ig6Wz5N8EnbdboLA=w449-h599-s-no-gm?authuser=0", 
      qrData: "https://www.obrinia.cl/contacto/jose-manuel",
      walletFile: "jose.pkpass" // ARCHIVO WALLET DE JM
    },
    clemente: {
      name: "Clemente del Prado",
      role: "Co-Fundador / CTO",
      phone: "+56 9 8765 4321", 
      email: "clemente@obrinia.cl",
      career: "Ingeniería Civil", 
      university: "P. Universidad Católica de Chile",
      photo: "https://lh3.googleusercontent.com/pw/AP1GczPAGbay3Va0BKkPUgiGX7SLhpD79DMBZF1xd5ccapCtq73169Pk_JQcetLv_gVSK3HfIG4txRC678ff79i6xEAe9l2pyQM_J7Q1wuh_fPuAsJDFtlAOksgQXD2-qY5LvUH5h_xJXeArENwt81PHkQW15Q=w449-h599-s-no-gm?authuser=0",
      qrData: "https://www.obrinia.cl/contacto/clemente",
      walletFile: "clemente.pkpass" // ARCHIVO WALLET DE CLEMENTE
    }
  };

  let currentUser = 'jose'; 

  function setUser(userId) {
    currentUser = userId;
    const user = users[userId];
    document.getElementById('user-name').innerText = user.name;
    document.getElementById('user-role').innerText = user.role;
    document.getElementById('user-phone').innerText = user.phone;
    document.getElementById('user-email').innerText = user.email;
    document.getElementById('user-career').innerText = user.career;
    document.getElementById('user-university').innerText = user.university;
    document.getElementById('user-photo').src = user.photo;
    
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(user.qrData)}&color=000000`;
    document.getElementById('user-qr').src = qrUrl;

    // Actualiza el link del botón de Apple Wallet
    document.getElementById('btn-apple-wallet').href = user.walletFile;
  }

  function descargarPDF() {
    const user = users[currentUser];
    const element = document.getElementById('credencial-pass');
    
    const nombreArchivo = `Credencial_ObrinIA_${user.name.replace(/ /g, '_')}.pdf`;

    const opt = {
      margin:       0,
      filename:     nombreArchivo,
      image:        { type: 'jpeg', quality: 1 },
      html2canvas:  { scale: 3, useCORS: true, backgroundColor: null },
      jsPDF:        { unit: 'px', format: [element.offsetWidth, element.offsetHeight], orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save();
  }

  setUser('jose');
</script>

</body>
</html>
