<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credencial - Obrín IA</title>
<style>
  /* Reset y fondo de pantalla */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f2f2f7; /* Color de fondo exterior suave */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  
  /* Contenedor principal de la tarjeta (Fondo Negro de Obrín IA) */
  .wallet-pass {
    width: 320px;
    background-color: #000000; /* Fondo negro como la imagen */
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    overflow: hidden;
    color: #ffffff; /* Letras blancas */
    position: relative;
    margin-top: 20px;
    /* Borde naranjo sutil inspirado en el borde de tu logo */
    border: 2px solid #ff6b00; 
  }

  .pass-header {
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .pass-header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
  }

  .pass-header img {
    width: 50px;
    height: 50px;
    border-radius: 50%; /* Logo redondo como la imagen */
    object-fit: contain;
  }

  .pass-body {
    padding: 0 20px 20px;
  }

  .user-info {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
  }

  .user-info img {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    /* Borde naranjo para la foto de perfil, manteniendo la línea de diseño */
    border: 2px solid #ff6b00; 
    margin-right: 15px;
    object-fit: cover;
    background-color: #333;
  }

  .user-details h2 {
    margin: 0 0 4px 0;
    font-size: 19px;
  }

  .user-details p {
    margin: 0;
    font-size: 14px;
    color: #ff6b00; /* Cargo en naranjo para destacar */
    font-weight: 600;
  }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 25px;
  }

  .field label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 4px;
    color: #a3a3a3; /* Gris claro para las etiquetas */
  }

  .field span {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff; /* Letras blancas */
  }

  /* Zona inferior para el QR (Se mantiene blanca para que el QR sea legible por las cámaras) */
  .qr-section {
    background-color: #ffffff;
    padding: 20px;
    text-align: center;
    border-radius: 12px;
    margin: 0 15px 15px;
    color: #000000;
  }

  .qr-section img {
    width: 160px;
    height: 160px;
  }

  .qr-section p {
    margin: 12px 0 0;
    font-size: 12px;
    font-weight: 600;
    color: #ff6b00; /* Texto inferior en naranjo */
  }

  /* Botones para probar */
  .demo-buttons {
    margin-bottom: 20px;
  }
  .demo-buttons button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background-color: #ff6b00; /* Botones en naranjo */
    color: white;
    cursor: pointer;
    font-weight: bold;
    margin: 0 5px;
  }
</style>
</head>
<body>

<div class="demo-buttons">
  <button onclick="setUser('jose')">Ver Credencial de José Manuel</button>
  <button onclick="setUser('clemente')">Ver Credencial de Clemente</button>
</div>

<div class="wallet-pass">
  <div class="pass-header">
    <h1>Obrín IA</h1>
    <!-- Se actualizó el src con el link del logo que enviaste -->
    <img src="https://lh3.googleusercontent.com/pw/AP1GczPj7GoQTmfzWXX4jkvO3hu7_npJJehlCcxrcJkbr5gB3X9y97XxXlu7q8aIcuDr5-g_iKmymERwIWbwfbxHFGt72nexFoqovweVO802AgG-os60vlB58jhfs42c-b07_L8eivxqFyQ8hLN9xrKnV7GlTQ=w599-h599-s-no-gm?authuser=0" alt="Logo Obrín IA">
  </div>
  
  <div class="pass-body">
    <div class="user-info">
      <img id="user-photo" src="" alt="Foto de perfil">
      <div class="user-details">
        <h2 id="user-name">Nombre</h2>
        <p id="user-role">Cargo</p>
      </div>
    </div>
    
    <div class="fields">
      <div class="field">
        <label>Teléfono</label>
        <span id="user-phone"></span>
      </div>
      <div class="field">
        <label>Email</label>
        <span id="user-email" style="font-size: 12px;"></span>
      </div>
    </div>
  </div>

  <div class="qr-section">
    <!-- El color del QR ahora es negro puro (000000) -->
    <img id="user-qr" src="" alt="Código QR">
    <p>Escanear para compartir contacto</p>
  </div>
</div>

<script>
  const users = {
    jose: {
      name: "José Manuel Christensen Correa",
      role: "Co-Fundador / CEO",
      phone: "+56 9 9258 2669", 
      email: "jmchristensen@estudiante.uc.cl",
      photo: "https://via.placeholder.com/65/000000/ff6b00?text=JM", // Placeholder con colores de la marca
      qrData: "https://www.obrinia.cl/contacto/jose-manuel" 
    },
    clemente: {
      name: "Clemente Del Prado Irigoín",
      role: "Co-Fundador / CTO",
      phone: "+56 9 8795 4736", 
      email: "cdelpradoi@estudiante.uc.cl",
      photo: "https://via.placeholder.com/65/000000/ff6b00?text=CP",
      qrData: "https://www.obrinia.cl/contacto/clemente"
    }
  };

  function setUser(userId) {
    const user = users[userId];
    document.getElementById('user-name').innerText = user.name;
    document.getElementById('user-role').innerText = user.role;
    document.getElementById('user-phone').innerText = user.phone;
    document.getElementById('user-email').innerText = user.email;
    document.getElementById('user-photo').src = user.photo;
    
    // QR negro puro para máximo contraste
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(user.qrData)}&color=000000`;
    document.getElementById('user-qr').src = qrUrl;
  }

  setUser('jose');
</script>

</body>
</html>
