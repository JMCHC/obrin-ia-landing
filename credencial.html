<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credencial - Obrín IA</title>
<style>
  /* Reset y fondo de pantalla */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f2f2f7; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  
  /* Contenedor principal de la tarjeta */
  .wallet-pass {
    width: 320px;
    background-color: #000000; 
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    overflow: hidden;
    color: #ffffff; 
    position: relative;
    margin-top: 20px;
    border: 2px solid #ff6b00; 
  }

  .pass-header {
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Logo que reemplaza el texto */
  .pass-header .logo-text {
    height: 35px; /* Altura ajustada para que se vea proporcionado */
    max-width: 180px;
    object-fit: contain;
  }

  /* Logo circular de la derecha */
  .pass-header .logo-icon {
    width: 50px;
    height: 50px;
    border-radius: 50%; 
    object-fit: contain;
  }

  .pass-body {
    padding: 0 20px 20px;
  }

  .user-info {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
  }

  .user-info img {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 2px solid #ff6b00; 
    margin-right: 15px;
    object-fit: cover;
    background-color: #333;
  }

  .user-details h2 {
    margin: 0 0 4px 0;
    font-size: 19px;
  }

  .user-details p {
    margin: 0;
    font-size: 14px;
    color: #ff6b00; 
    font-weight: 600;
  }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 25px;
  }

  .field label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 4px;
    color: #a3a3a3; 
  }

  .field span {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff; 
  }

  /* Zona inferior para el QR */
  .qr-section {
    background-color: #ffffff;
    padding: 20px;
    text-align: center;
    border-radius: 12px;
    margin: 0 15px 15px;
    color: #000000;
  }

  .qr-section img {
    width: 160px;
    height: 160px;
  }

  .qr-section p {
    margin: 12px 0 0;
    font-size: 12px;
    font-weight: 600;
    color: #ff6b00; 
  }

  /* Botones para probar */
  .demo-buttons {
    margin-bottom: 20px;
  }
  .demo-buttons button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background-color: #ff6b00; 
    color: white;
    cursor: pointer;
    font-weight: bold;
    margin: 0 5px;
  }
</style>
</head>
<body>

<div class="demo-buttons">
  <button onclick="setUser('jose')">Ver Credencial de José Manuel</button>
  <button onclick="setUser('clemente')">Ver Credencial de Clemente</button>
</div>

<div class="wallet-pass">
  <div class="pass-header">
    <!-- Nuevo logo principal (reemplaza el texto) -->
    <img class="logo-text" src="https://lh3.googleusercontent.com/pw/AP1GczPJ1o1fhAFasqk2uwiGOuIwNnr0sd1sbMIaseQEzlyn_W_xjs_k8gFJqlCiuerfw-PzV3uiZAbh26Ueap4seYL8PGOG-kX_Nt3Ptlf2HiAuTbkJB0C-gjHkn91LqRKKtxXLb-pKqaf1YG9RZ6xaPU9qyQ=w599-h599-s-no-gm?authuser=0" alt="Obrín IA">
    <!-- Logo circular en la esquina superior derecha -->
    <img class="logo-icon" src="https://lh3.googleusercontent.com/pw/AP1GczPj7GoQTmfzWXX4jkvO3hu7_npJJehlCcxrcJkbr5gB3X9y97XxXlu7q8aIcuDr5-g_iKmymERwIWbwfbxHFGt72nexFoqovweVO802AgG-os60vlB58jhfs42c-b07_L8eivxqFyQ8hLN9xrKnV7GlTQ=w599-h599-s-no-gm?authuser=0" alt="Icono Obrín IA">
  </div>
  
  <div class="pass-body">
    <div class="user-info">
      <img id="user-photo" src="" alt="Foto de perfil">
      <div class="user-details">
        <h2 id="user-name">Nombre</h2>
        <p id="user-role">Cargo</p>
      </div>
    </div>
    
    <div class="fields">
      <div class="field">
        <label>Teléfono</label>
        <span id="user-phone"></span>
      </div>
      <div class="field">
        <label>Email</label>
        <span id="user-email" style="font-size: 12px;"></span>
      </div>
    </div>
  </div>

  <div class="qr-section">
    <img id="user-qr" src="" alt="Código QR">
    <p>Escanear para compartir contacto</p>
  </div>
</div>

<script>
  const users = {
    jose: {
      name: "José Manuel Christensen",
      role: "Co-Fundador / CEO",
      phone: "+56 9 9258 2669", 
      email: "jose@obrinia.cl",
      photo: "https://lh3.googleusercontent.com/pw/AP1GczPx1EJ_8fIwPO2dphbWGkNuor7vTGc9aKzSdIdvFeLuH3WCy24NLlHLs1BCK9M5qrCeB8DxVYks-46LohhaR4NA4K3pyxX7sqHCackmj7pPEiKmArQaN-v5HpnKrY5Z5MLLLSdUR3Ig6Wz5N8EnbdboLA=w449-h599-s-no-gm?authuser=0", 
      qrData: "https://www.obrinia.cl/contacto/jose-manuel" 
    },
    clemente: {
      name: "Clemente del Prado",
      role: "Co-Fundador / CTO",
      phone: "+56 9 8765 4321", // Si Clemente tiene otro número, reemplázalo aquí
      email: "clemente@obrinia.cl",
      photo: "https://lh3.googleusercontent.com/pw/AP1GczPAGbay3Va0BKkPUgiGX7SLhpD79DMBZF1xd5ccapCtq73169Pk_JQcetLv_gVSK3HfIG4txRC678ff79i6xEAe9l2pyQM_J7Q1wuh_fPuAsJDFtlAOksgQXD2-qY5LvUH5h_xJXeArENwt81PHkQW15Q=w449-h599-s-no-gm?authuser=0",
      qrData: "https://www.obrinia.cl/contacto/clemente"
    }
  };

  function setUser(userId) {
    const user = users[userId];
    document.getElementById('user-name').innerText = user.name;
    document.getElementById('user-role').innerText = user.role;
    document.getElementById('user-phone').innerText = user.phone;
    document.getElementById('user-email').innerText = user.email;
    document.getElementById('user-photo').src = user.photo;
    
    // Generador dinámico de QR
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(user.qrData)}&color=000000`;
    document.getElementById('user-qr').src = qrUrl;
  }

  // Cargar por defecto la credencial de José Manuel al abrir
  setUser('jose');
</script>

</body>
</html>
