<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credencial - Obrín IA</title>
<!-- Librería para generar el PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  /* Reset y fondo de pantalla */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f2f2f7; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  
  /* Contenedor principal de la tarjeta */
  .wallet-pass {
    width: 320px;
    background-color: #000000; 
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    overflow: hidden;
    color: #ffffff; 
    position: relative;
    margin-top: 20px;
    border: 2px solid #ff6b00; 
  }

  .pass-header {
    padding: 15px 20px 5px; /* Reducido para subir el contenido */
    display: flex;
    justify-content: center; /* Centramos el logo circular */
    align-items: center;
  }

  /* Logo circular */
  .pass-header .logo-icon {
    width: 55px;
    height: 55px;
    border-radius: 50%; 
    object-fit: contain;
  }

  .pass-body {
    padding: 0 20px 15px; /* Reducido para compactar el espacio inferior */
  }

  .user-info {
    display: flex;
    align-items: center;
    margin-bottom: 15px; /* Reducido para compactar y subir */
  }

  .user-info img {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 2px solid #ff6b00; 
    margin-right: 15px;
    object-fit: cover;
    background-color: #333;
  }

  .user-details h2 {
    margin: 0 0 4px 0;
    font-size: 19px;
  }

  .user-details p {
    margin: 0;
    font-size: 14px;
    color: #ff6b00; 
    font-weight: 600;
  }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 25px;
  }

  .field label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 4px;
    color: #a3a3a3; 
  }

  .field span {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff; 
  }

  /* Ocupar ambas columnas para textos largos como la Universidad */
  .field.full-width {
    grid-column: span 2;
  }

  /* Zona inferior para el QR */
  .qr-section {
    background-color: #ffffff;
    padding: 20px;
    text-align: center;
    border-radius: 12px;
    margin: 0 15px 15px;
    color: #000000;
  }

  .qr-section img {
    width: 160px;
    height: 160px;
  }

  .qr-section p {
    margin: 12px 0 0;
    font-size: 12px;
    font-weight: 600;
    color: #ff6b00; 
  }

  /* Botones para probar */
  .demo-buttons {
    margin-bottom: 20px;
  }
  .demo-buttons button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background-color: #ff6b00; 
    color: white;
    cursor: pointer;
    font-weight: bold;
    margin: 0 5px;
  }

  /* Estilo para el botón de descarga PDF */
  .download-btn {
    margin-top: 25px;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    background-color: #10b981; /* Color verde para diferenciar de los botones de test */
    color: white;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: background-color 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .download-btn:hover {
    background-color: #059669;
  }
</style>
</head>
<body>

<div class="demo-buttons">
  <button onclick="setUser('jose')">Ver Credencial de José Manuel</button>
  <button onclick="setUser('clemente')">Ver Credencial de Clemente</button>
</div>

<!-- Se agregó el ID 'credencial-card' para que el script sepa qué parte exportar a PDF -->
<div class="wallet-pass" id="credencial-card">
  <div class="pass-header">
    <!-- Solo el logo circular centrado -->
    <img class="logo-icon" src="https://lh3.googleusercontent.com/pw/AP1GczPj7GoQTmfzWXX4jkvO3hu7_npJJehlCcxrcJkbr5gB3X9y97XxXlu7q8aIcuDr5-g_iKmymERwIWbwfbxHFGt72nexFoqovweVO802AgG-os60vlB58jhfs42c-b07_L8eivxqFyQ8hLN9xrKnV7GlTQ=w599-h599-s-no-gm?authuser=0" alt="Icono Obrín IA">
  </div>
  
  <div class="pass-body">
    <div class="user-info">
      <img id="user-photo" src="" alt="Foto de perfil">
      <div class="user-details">
        <h2 id="user-name">Nombre</h2>
        <p id="user-role">Cargo</p>
      </div>
    </div>
    
    <div class="fields">
      <div class="field">
        <label>Teléfono</label>
        <span id="user-phone"></span>
      </div>
      <div class="field">
        <label>Email</label>
        <span id="user-email" style="font-size: 12px;"></span>
      </div>
      <!-- Nuevos campos de Educación que ocupan todo el ancho -->
      <div class="field full-width">
        <label>Carrera</label>
        <span id="user-degree"></span>
      </div>
      <div class="field full-width">
        <label>Universidad</label>
        <span id="user-university" style="font-size: 12px;"></span>
      </div>
    </div>
  </div>

  <div class="qr-section">
    <img id="user-qr" src="" alt="Código QR">
    <p>Escanear para compartir contacto</p>
  </div>
</div>

<!-- Botón para descargar el PDF -->
<button class="download-btn" onclick="downloadPDF()">
  📥 Descargar Credencial en PDF
</button>

<script>
  const users = {
    jose: {
      name: "José Manuel Christensen",
      role: "Co-Fundador / CEO",
      phone: "+56 9 9258 2669", 
      email: "jose@obrinia.cl",
      degree: "Construcción Civil",
      university: "Pontificia Universidad Católica de Chile",
      photo: "https://lh3.googleusercontent.com/pw/AP1GczPx1EJ_8fIwPO2dphbWGkNuor7vTGc9aKzSdIdvFeLuH3WCy24NLlHLs1BCK9M5qrCeB8DxVYks-46LohhaR4NA4K3pyxX7sqHCackmj7pPEiKmArQaN-v5HpnKrY5Z5MLLLSdUR3Ig6Wz5N8EnbdboLA=w449-h599-s-no-gm?authuser=0", 
      qrData: "https://www.obrinia.cl/contacto/jose-manuel" 
    },
    clemente: {
      name: "Clemente del Prado",
      role: "Co-Fundador / CTO",
      phone: "+56 9 8765 4321", // Si Clemente tiene otro número, reemplázalo aquí
      email: "clemente@obrinia.cl",
      degree: "Ingeniería Civil", // Reemplazar con la carrera de Clemente si es distinta
      university: "Pontificia Universidad Católica de Chile", // Reemplazar si es distinta
      photo: "https://lh3.googleusercontent.com/pw/AP1GczPAGbay3Va0BKkPUgiGX7SLhpD79DMBZF1xd5ccapCtq73169Pk_JQcetLv_gVSK3HfIG4txRC678ff79i6xEAe9l2pyQM_J7Q1wuh_fPuAsJDFtlAOksgQXD2-qY5LvUH5h_xJXeArENwt81PHkQW15Q=w449-h599-s-no-gm?authuser=0",
      qrData: "https://www.obrinia.cl/contacto/clemente"
    }
  };

  function setUser(userId) {
    const user = users[userId];
    document.getElementById('user-name').innerText = user.name;
    document.getElementById('user-role').innerText = user.role;
    document.getElementById('user-phone').innerText = user.phone;
    document.getElementById('user-email').innerText = user.email;
    document.getElementById('user-degree').innerText = user.degree;
    document.getElementById('user-university').innerText = user.university;
    document.getElementById('user-photo').src = user.photo;
    
    // Generador dinámico de QR
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(user.qrData)}&color=000000`;
    document.getElementById('user-qr').src = qrUrl;
  }

  // Cargar por defecto la credencial de José Manuel al abrir
  setUser('jose');

  // Función para descargar el PDF
  function downloadPDF() {
    // 1. Obtenemos el elemento HTML que queremos convertir (la credencial)
    const element = document.getElementById('credencial-card');
    
    // 2. Obtenemos el nombre actual para nombrar el archivo automáticamente
    const currentName = document.getElementById('user-name').innerText.replace(/\s+/g, '_');
    
    // 3. Configuramos las opciones del PDF
    const options = {
      margin:       0.2, // Margen blanco alrededor de la tarjeta en el PDF
      filename:     `Credencial_ObrinIA_${currentName}.pdf`, // Nombre del archivo
      image:        { type: 'jpeg', quality: 1 },
      html2canvas:  { 
        scale: 3, // Alta resolución
        useCORS: true, // Permite cargar las imágenes externas (Google Photos, API del QR)
        backgroundColor: '#000000' 
      },
      jsPDF:        { unit: 'in', format: [4, 6], orientation: 'portrait' } // Tamaño personalizado aproximado a la credencial
    };

    // 4. Ejecutamos la generación y descarga
    html2pdf().set(options).from(element).save();
  }
</script>

</body>
</html>
